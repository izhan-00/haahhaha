<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>For Reela</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@300;400&family=Caveat:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#f4e9d2;--gold:#d9b772;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html,body{height:100%;margin:0;background:#030607;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
.lay{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8vw;font-family:'Cormorant Garamond',Georgia,serif;color:var(--cream)}

@keyframes rv{0%{opacity:0;filter:blur(9px);transform:translateY(7px);color:#ffd98a;text-shadow:0 0 22px #ffcf7a}35%{opacity:.95;filter:blur(2px);color:#fff1c9;text-shadow:0 0 26px #ffc86a}100%{opacity:1;filter:blur(0);transform:none;color:inherit;text-shadow:0 0 18px rgba(255,220,150,.18)}}

#f3{font:500 clamp(18px,2.4vw,24px) Caveat,cursive;color:#f3dfb4;margin-top:2.4em;opacity:.85}

.b.v{opacity:.4}.b.v:hover{opacity:.9}
#snd{right:max(18px,env(safe-area-inset-right))}#rp{left:max(18px,env(safe-area-inset-left));font:18px Georgia}
</style></head><body>
<canvas id="c"></canvas><div id="msgs"></div>
<div class="lay" id="intro"><div id="i1"></div><div id="i2"></div><div id="i3"></div></div>
<div class="lay" id="fin"><div id="f1"></div><div id="f2"></div><div id="f3"></div></div>
<button class="b" id="snd" aria-label="Toggle sound"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 6h2.5L8 3v10L4.5 10H2z"/><path id="sw" d="M10.5 5.5c1 1.4 1 3.6 0 5M12.5 4c1.8 2.3 1.8 5.7 0 8" opacity=".3"/></svg></button>
<button class="b" id="rp" aria-label="Begin again">&#8635;</button>
<div id="ld"><i></i></div>
<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const C=$('#c'),X=C.getContext('2d'),O=document.createElement('canvas'),OX=O.getContext('2d');
const R=(a,b)=>a+Math.random()*(b-a),cl=(v,a=0,b=1)=>v<a?a:v>b?b:v,sm=t=>t*t*(3-2*t),lp=(a,b,t)=>a+(b-a)*t,TAU=Math.PI*2;
const touch=matchMedia('(pointer:coarse)').matches;
let W,H,D,U,T=0,phase='load',dark=.975,warm=0,life=0,alive=0,wakeAt=3,lastProg=0,wind=0,finalGo=0;
const P={x:-999,y:-999,tx:-999,ty:-999,a:0,sp:0,down:0,hold:0,still:0,in:0,px:0,py:0,hd:0};
const cam={x:0},moon={x:0,y:0,p:0,said:0},lights=[],Pt=[],rip=[];let Fl=[],em=null,ws=null,wNext=1e9,wFound=0,sec=null,said={},BL=[],SP=[];
// ---------- audio ----------
let AC,mg,dly,sOn=0;
function aInit(){AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=0;mg.connect(AC.destination);
const n=AC.sampleRate*3,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=l*.985+(Math.random()*2-1)*.015;d[i]=l*7}
const s=AC.createBufferSource();s.buffer=b;s.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=380;const g=AC.createGain();g.gain.value=.5;
const lf=AC.createOscillator(),lg=AC.createGain();lf.frequency.value=.08;lg.gain.value=.25;lf.connect(lg);lg.connect(g.gain);lf.start();s.connect(f);f.connect(g);g.connect(mg);s.start();
[98,147.5,196.4].forEach((fr,i)=>{const o=AC.createOscillator(),q=AC.createGain();o.frequency.value=fr;q.gain.value=.012/(i+1);o.connect(q);q.connect(mg);o.start()});
dly=AC.createDelay();dly.delayTime.value=.46;const fb=AC.createGain();fb.gain.value=.38;dly.connect(fb);fb.connect(dly);dly.connect(mg)}
function chime(i=0,v=.05){if(!sOn)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.value=[523.25,587.33,659.25,783.99,880,1046.5,1174.66][((i%7)+7)%7]*(Math.random()<.2?.5:1);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+3.2);o.connect(g);g.connect(mg);g.connect(dly);o.start(t);o.stop(t+3.3)}
$('#snd').onclick=()=>{if(!AC)aInit();AC.resume();sOn=!sOn;mg.gain.linearRampToValueAtTime(sOn?.8:0,AC.currentTime+1.5);$('#sw').style.opacity=sOn?1:.3;chime(2,.06)};
// ---------- text ----------
function spell(el,t,st=60,d0=0){el.innerHTML='';let i=0;t.split('\n').forEach((ln,k)=>{if(k)el.appendChild(document.createElement('br'));ln.split(' ').forEach((w,j)=>{if(j)el.append(' ');const s=document.createElement('span');s.className='w';[...w].forEach(c=>{const h=document.createElement('span');h.className='ch';h.textContent=c;h.style.animationDelay=(d0+i*st+Math.random()*st*2)/1000+'s';i++;s.appendChild(h)});el.appendChild(s)})});return i*st}
function say(t,o={}){const e=document.createElement('div');e.className='say'+(o.hand?' hand':'');const d=spell(e,t,o.hand?70:50);e.style.left=cl(o.x??W/2,110,W-110)+'px';e.style.top=(o.y??H*.2)+'px';e.style.transform='translate(-50%,-50%) rotate('+(o.hand?R(-3,2):0)+'deg)';$('#msgs').appendChild(e);const L=(o.dur||7000)+d;setTimeout(()=>e.classList.add('gone'),L);setTimeout(()=>e.remove(),L+3500)}
const once=(k,fn)=>{if(!said[k]){said[k]=1;fn()}};
// ---------- background ----------
const mk=(w,h,fn)=>{const c=document.createElement('canvas');c.width=w|0;c.height=h|0;fn(c.getContext('2d'),c.width,c.height);return c};
let SKY,LF,LM,LN,GR,MOON,FOG,VIG,NP,GS;
GS=mk(64,64,g=>{const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,242,210,1)');r.addColorStop(.2,'rgba(255,214,140,.5)');r.addColorStop(1,'rgba(255,190,100,0)');g.fillStyle=r;g.fillRect(0,0,64,64)});
FOG=mk(256,256,g=>{const r=g.createRadialGradient(128,128,0,128,128,128);r.addColorStop(0,'rgba(120,165,158,.3)');r.addColorStop(1,'rgba(120,165,158,0)');g.fillStyle=r;g.fillRect(0,0,256,256)});
MOON=mk(360,360,g=>{let r=g.createRadialGradient(180,180,0,180,180,180);r.addColorStop(0,'rgba(200,225,230,.34)');r.addColorStop(.25,'rgba(150,190,200,.1)');r.addColorStop(1,'rgba(150,190,200,0)');g.fillStyle=r;g.fillRect(0,0,360,360);r=g.createRadialGradient(172,172,2,180,180,26);r.addColorStop(0,'#fdf7e6');r.addColorStop(1,'#d8dcc8');g.fillStyle=r;g.beginPath();g.arc(180,180,26,0,TAU);g.fill();for(let i=0;i<7;i++){g.fillStyle='rgba(120,130,120,.13)';g.beginPath();g.arc(180+R(-14,14),180+R(-14,14),R(2,6),0,TAU);g.fill()}});
NP=mk(128,128,g=>{for(let i=0;i<1800;i++){g.fillStyle=`rgba(255,255,255,${R(0,.5)})`;g.fillRect(R(0,128),R(0,128),1,1)}});
function buildBG(){
SKY=mk(W,H,g=>{const q=g.createLinearGradient(0,0,0,H*.62);q.addColorStop(0,'#03070c');q.addColorStop(.6,'#0a1b1f');q.addColorStop(1,'#16342f');g.fillStyle=q;g.fillRect(0,0,W,H);for(let i=0;i<110;i++){g.fillStyle=`rgba(255,245,220,${R(.1,.6)})`;g.fillRect(R(0,W),R(0,H*.45),R(.6,1.4),R(.6,1.4))}});
const ridge=(base,amp,fq,sd,tr,c1,c2,hz)=>mk(W*1.14,H,(g,w)=>{const y=x=>H*base+(Math.sin(x*fq+sd)*amp+Math.sin(x*fq*2.3+sd*2)*amp*.45+Math.sin(x*fq*.4+sd*3)*amp*1.3)*(H/800);
g.beginPath();g.moveTo(0,H);for(let x=0;x<=w;x+=6)g.lineTo(x,y(x));g.lineTo(w,H);g.closePath();const q=g.createLinearGradient(0,H*(base-.08),0,H*(base+.3));q.addColorStop(0,c1);q.addColorStop(1,c2);g.fillStyle=q;g.fill();g.fillStyle=c1;
if(tr)for(let x=0;x<w;x+=R(8,22)*tr){const yy=y(x)+4,h=R(28,100)*(H/800)*(1+base);if(Math.random()<.65){for(let k=0;k<3;k++){const hh=h*(1-k*.22),b=h*.17*(1+k*.5),by=yy-h*.28*k;g.beginPath();g.moveTo(x-b,by);g.lineTo(x,by-hh*.62);g.lineTo(x+b,by);g.fill()}}else{g.beginPath();g.ellipse(x,yy-h*.5,h*.22,h*.5,0,0,TAU);g.fill()}}
g.globalCompositeOperation='source-atop';const hq=g.createLinearGradient(0,H*(base-.2),0,H*(base+.06));hq.addColorStop(0,`rgba(80,125,120,${hz})`);hq.addColorStop(1,'rgba(80,125,120,0)');g.fillStyle=hq;g.fillRect(0,0,w,H)});
LF=ridge(.5,26,.0042,1.3,2.2,'#0f2829','#0a1c1e',.34);LM=ridge(.57,20,.0058,4.1,1.5,'#0a1d1d','#07151a',.22);LN=ridge(.635,12,.009,8,.9,'#071513','#050e0d',.1);
GR=mk(W,H*.4,(g,w,h)=>{const q=g.createLinearGradient(0,0,0,h);q.addColorStop(0,'rgba(12,30,22,0)');q.addColorStop(.3,'rgba(10,26,19,.9)');q.addColorStop(1,'#030806');g.fillStyle=q;g.fillRect(0,0,w,h);for(let i=0;i<1400;i++){const x=R(0,w),y=R(h*.1,h),l=R(4,13)*(.4+y/h);g.strokeStyle=`rgba(${R(20,50)|0},${R(55,95)|0},${R(40,60)|0},${R(.08,.3)})`;g.beginPath();g.moveTo(x,y);g.lineTo(x+R(-3,3),y-l);g.stroke()}});
VIG=mk(W,H,g=>{const r=g.createRadialGradient(W/2,H*.55,Math.min(W,H)*.3,W/2,H*.55,Math.max(W,H)*.78);r.addColorStop(0,'rgba(0,0,0,0)');r.addColorStop(1,'rgba(0,0,0,.62)');g.fillStyle=r;g.fillRect(0,0,W,H)})}
function rs(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0);O.width=W/4|0;O.height=H/4|0;U=cl(Math.sqrt(W*H)/760,.62,1.2);buildBG()}
// ---------- flowers ----------
const PAL={cream:[247,238,218],blush:[236,184,182],rose:[200,104,118],burg:[122,30,56],gold:[226,186,108]};
const KS={rose:{rings:[[6,1,.5,.95,.5],[7,.8,.44,.75,.5],[5,.58,.38,.5,.5]],sp:1.05,h:[120,165]},daisy:{rings:[[14,1,.17,1,.2],[11,.8,.15,.8,.2]],sp:1.5,h:[100,145],c:1},lily:{rings:[[6,1.25,.3,.95,.1],[5,1.05,.25,.7,.1]],sp:1.25,h:[140,185]},anem:{rings:[[5,.95,.62,1,.9],[5,.7,.5,.7,.9]],sp:1.35,h:[90,125],c:2}};
function mkF(rx,ry,role,kind,pal,sc=1){const K=KS[kind],pets=[];K.rings.forEach((r,ri)=>{for(let i=0;i<r[0];i++)pets.push({r:ri,i,n:r[0],j:R(-.1,.1),pd:R(0,.5),lj:R(.88,1.1),sh:R(.88,1.08),gone:0})});
return{rx,ry,role,K,kind,pal,pets,sc,hh:R(...K.h),bend:R(-14,14),bt:-1,g:0,o:0,ow:0,glow:0,gt:0,lean:0,lv:0,f1:R(.35,.7),f2:R(.8,1.4),p1:R(0,6.3),p2:R(0,6.3),rv:R(.8,1.25),dl:R(.85,1.2),sl:R(.9,1.3),near:0,hint:0,opened:0,hb:0,hbs:0,sw0:0,x:0,y:0,s:1,hx:0,hy:0,auto:0,delay:R(1,3.2),gU:0,keep:0,cool:0,pc:0,pend:0}}
function plant(){Fl=[];const pos=[];let n=0;while(pos.length<13&&n++<800){const ry=R(.69,.93),rx=R(.07,.93),s=.55+.75*sm(cl((ry-.6)/.32));if(pos.some(q=>Math.hypot((q[0]-rx)*W,(q[1]-ry)*H*1.8)<72*Math.max(q[2],s)*U))continue;pos.push([rx,ry,s,null])}
const pk=(a,b,r)=>{let best,bd=1e9;pos.forEach(q=>{if(q[3])return;const d=Math.hypot(q[0]-a,q[1]-b);if(d<bd){bd=d;best=q}});best[3]=r};
pk(.5,.82,'seeder');pk(.27,.78,'sleeper');pk(.74,.76,'shy');pk(.62,.92,'passive');pk(.5,.69,'echo');
const kinds=['rose','lily','daisy','anem','rose','lily'],pc={rose:()=>Math.random()<.5?[PAL.blush,PAL.rose]:[PAL.burg,PAL.rose],lily:()=>[PAL.cream,PAL.blush],daisy:()=>[PAL.cream,PAL.cream],anem:()=>[PAL.burg,PAL.rose]};
pos.forEach(q=>{const r=q[3]||'chain',k={seeder:'rose',sleeper:'lily',shy:'anem',passive:'daisy',echo:'lily'}[r]||kinds[Math.random()*6|0];const f=mkF(q[0],q[1],r,k,r==='seeder'?[PAL.burg,PAL.rose]:pc[k](),r==='echo'?.7:1);
if(r!=='chain'){f.bt=99;f.g=1}if(r==='shy'||r==='passive'||r==='echo'){f.ow=1;f.o=1;f.opened=1}if(r==='seeder')f.keep=.45;Fl.push(f)});
sec=mkF(.1,.63,'moon','lily',[PAL.cream,PAL.blush],.95);Fl.push(sec);
BL=[];for(let i=0;i<30;i++)BL.push({rx:R(0,1),h:R(70,190),ph:R(0,9),b:0,w:R(2,6)});
SP=[];for(let i=0;i<10;i++)SP.push({rx:R(.04,.96),ry:R(.7,.95),h:R(60,95),ph:R(0,9),l:0})}
const chainL=()=>Fl.filter(f=>f.role==='chain');
const dormant=()=>chainL().filter(f=>f.bt<0&&!f.pend);
function wake(f,d=0){if(f.bt>=0||f.waking)return;f.waking=1;f.hint=1;lastProg=T;setTimeout(()=>{f.bt=0;f.auto=1;f.hint=0;ripple(f.x,f.y,.7);chime(Math.random()*7|0,.04)},d)}
function ripple(x,y,s){rip.push({x,y,t:0,s})}
function pollen(f,n){for(let i=0;i<n;i++)Pt.push({k:'pol',x:f.hx,y:f.hy,vx:R(-22,22),vy:R(-60,-16),t:0,life:R(7,13),r:R(5,10),ph:R(0,9)})}
function seeds(f,n){const dm=dormant().sort((a,b)=>Math.hypot(b.x-f.x,b.y-f.y)-Math.hypot(a.x-f.x,a.y-f.y))[0];for(let i=0;i<n;i++){let tr=null;if(i===0&&dm){tr=dm;dm.pend=1;dm.hint=1}Pt.push({k:'seed',x:f.hx,y:f.hy,vx:R(-34,34),vy:R(-100,-45),t:0,life:i?R(9,14):30,r:R(6,9),ph:R(0,9),tr})}chime(4,.05)}
function dropPetals(f,n){const live=f.pets.filter(p=>!p.gone);if(live.length<f.pets.length*.7)return;for(let i=0;i<n;i++){const p=live[Math.random()*live.length|0];if(!p||p.gone)continue;p.gone=1;let tr=null;if(i===0){const d=dormant().sort((a,b)=>Math.hypot(a.x-f.x,a.y-f.y)-Math.hypot(b.x-f.x,b.y-f.y))[0];if(d){tr=d;d.pend=1;d.hint=1}}
Pt.push({k:'pet',x:f.hx+R(-8,8),y:f.hy,vx:R(-20,20),vy:tr?-60:R(-30,-6),rot:R(0,6),vr:R(-1.5,1.5),len:R(8,14)*f.s*U,c:f.pal[p.r?1:0],t:0,ph:R(0,9),tr,rest:0,gy:R(.74,.95)*H})}}
function onOpen(f){f.opened=1;lastProg=T;life+=({seeder:2,sleeper:1,moon:2}[f.role]||1);ripple(f.x,f.y,.8);chime(Math.floor(life),.05);pollen(f,10+R(0,8)|0);
const ec=Fl.find(q=>q.role==='echo'),far=(ec&&Math.random()<.6?ec:Fl.filter(q=>q!==f&&q.g>.9).sort((a,b)=>Math.hypot(b.x-f.x,b.y-f.y)-Math.hypot(a.x-f.x,a.y-f.y))[0]);if(far&&far!==f)far.gU=T+6;
Fl.forEach(q=>{if(q!==f&&Math.hypot(q.x-f.x,q.y-f.y)<200*U){q.gU=Math.max(q.gU,T+3.5);q.hb=Math.min(.28,q.hb+.09)}});
if(f.role==='seeder'){f.keep=0;setTimeout(()=>seeds(f,7),1400);once('c1',()=>say('Some flowers are better when they’re made by hand.'))}
if(f.role==='sleeper')once('sl',()=>say('she just needed a moment.',{hand:1,x:f.x,y:f.hy-90*U,dur:6000}));
if(f.role==='moon')once('mn',()=>say('you followed it. i hoped you would.',{hand:1,x:f.x+90,y:f.hy-60,dur:8000}));
if(f.role==='chain'&&!f.auto0){f.auto0=1}}
function poke(f){f.lv+=R(-1.4,1.4);chime(Math.random()*7|0,.03);
if(f.role==='passive')return;if(!f.ow&&f.g>.8){f.ow=1;f.lv-=.6}else if(f.role==='seeder'&&T>f.cool&&f.opened){f.cool=T+9;seeds(f,5)}else if(f.role==='echo')pollen(f,12);else if(f.opened&&f.role!=='shy')dropPetals(f,3)}
function drawF(f,dt){const u=f.s*U,g=f.g;
if(f.bt<0){if(f.hint||f.pend){X.globalCompositeOperation='lighter';gl(f.x,f.y-3,(12+(f.pend?10:0))*u,.2+.15*Math.sin(T*2+f.p1));X.globalCompositeOperation='source-over'}return}
const sw=Math.sin(T*f.f1+f.p1)*.045+Math.sin(T*f.f2+f.p2)*.025+wind*.04;
const H0=f.hh*u*(1+f.hbs)*g,ang=f.lean+sw,hx=f.x+Math.sin(ang)*H0,hy=f.y-Math.cos(ang)*H0,cx=f.x+Math.sin(ang*.3)*H0*.55+f.bend*u,cy=f.y-H0*.55;f.hx=hx;f.hy=hy;
X.fillStyle='rgba(0,0,0,.3)';X.beginPath();X.ellipse(f.x,f.y+2,(8+14*g)*u,3*u,0,0,TAU);X.fill();

for(const p of Pt){if(p.k==='dust'){const a=(.14+p.wk*.8)*(.6+.4*Math.sin(T*p.tw+p.ph));if(p.wk>.15)gl(p.x,p.y,6+p.wk*5,a*.6);else{X.fillStyle=`rgba(235,220,175,${a})`;X.fillRect(p.x,p.y,p.r,p.r)}}
else if(p.k==='ff'){const b=Math.pow(Math.max(0,Math.sin(T*p.tw+p.ph)),2);gl(p.x,p.y,5+5*p.z,.12+.7*b*p.z)}
else if(p.k==='pol'){const a=Math.sin(Math.PI*cl(p.t/p.life))*.75;gl(p.x,p.y,p.r,a*.7)}
else if(p.k==='seed'){const a=cl(Math.min(p.t,1)*(p.t>p.life-2?(p.life-p.t)/2:1));gl(p.x,p.y,p.r*2.2,.9*a);if(Math.random()<.3)Pt.push({k:'tr',x:p.x,y:p.y,t:0,life:1.1})}
else if(p.k==='sp'){gl(p.x,p.y,7,(1-p.t/p.life)*.7)}
else if(p.k==='tr'){gl(p.x,p.y,5,(1-p.t/p.life)*.35)}}
for(const r of rip){const k=r.t/2.4,rr=k*(70+50*r.s)*U;X.strokeStyle=`rgba(255,225,160,${(1-k)*.35})`;X.lineWidth=1.2;X.beginPath();X.ellipse(r.x,r.y,rr,rr*.32,0,0,TAU);X.stroke()}
if(P.a>.05){gl(P.x,P.y,46,.1*P.a);gl(P.x,P.y,5,.35*P.a)}
if(em)drawOrb(em,em.a,18);if(ws)drawOrb(ws,.95,16);
X.globalCompositeOperation='source-over';X.globalAlpha=.035;X.fillStyle=X.createPattern(NP,'repeat');X.save();X.translate(R(0,128),R(0,128));X.fillRect(-128,-128,W+256,H+256);X.restore();X.globalAlpha=1}
const lerp2=(a,c,b,t)=>(1-t)*(1-t)*a+2*(1-t)*t*c+t*t*b;
const fgs=[...Array(6)].map((_,i)=>({x:Math.random(),y:R(.5,.78),s:R(500,900),v:R(-12,12),z:i%2}));
function fog(z,a){X.globalCompositeOperation='lighter';fgs.forEach(f=>{if(f.z!==z)return;f.x+=f.v/W*.016;if(f.x<-.4)f.x=1.4;if(f.x>1.4)f.x=-.4;X.globalAlpha=a*(.8+.2*Math.sin(T*.1+f.s));X.drawImage(FOG,f.x*W-f.s/2,f.y*H-f.s*.25,f.s,f.s*.5)});X.globalAlpha=1;X.globalCompositeOperation='source-over'}
// ---------- input ----------
addEventListener('pointermove',e=>{P.tx=e.clientX;P.ty=e.clientY;P.in=1;if(P.x<-500){P.x=P.tx;P.y=P.ty}});
addEventListener('pointerdown',e=>{P.tx=P.x=e.clientX;P.ty=P.y=e.clientY;P.in=1;P.down=1;P.hold=0;P.hx=e.clientX;P.hy=e.clientY;press(e.clientX,e.clientY)});
addEventListener('pointerup',()=>{P.down=0});addEventListener('pointercancel',()=>{P.down=0});document.documentElement.addEventListener('mouseleave',()=>{P.in=0});
function press(x,y){if(phase!=='garden'&&phase!=='final')return;let best=null,bd=1e9;Fl.forEach(f=>{if(f.g<.45)return;const d=Math.hypot(x-f.hx,y-f.hy);if(d<56*f.s*U+16&&d<bd){bd=d;best=f}});if(best){poke(best);return}
const dm=Fl.find(f=>f.role==='chain'&&f.bt<0&&(f.hint||Math.hypot(x-f.x,y-f.y)<150)&&Math.hypot(x-f.x,y-f.y)<150);if(dm){wake(dm,300);life+=.3;return}
if(Math.hypot(x-moon.x,y-moon.y)<60*U){moon.p=1;chime(0,.06);setTimeout(()=>chime(3,.05),300);setTimeout(()=>chime(5,.04),700);once('moon',()=>{life+=.5;say('even the moon is in on it.',{hand:1,x:moon.x-130,y:moon.y+90,dur:6000})});return}
ripple(x,y,1);for(let i=0;i<5;i++)Pt.push({k:'sp',x,y,vx:R(-25,25),vy:R(-35,-5),t:0,life:R(.8,1.5)});life+=.05}
// ---------- progression ----------
function stage(){alive=cl(life/16);
if(life>=wakeAt){wakeAt+=2.4;const d=dormant();if(d.length){const o=Fl.filter(f=>f.opened&&f.role!=='moon');const ref=o[Math.random()*o.length|0]||Fl[0];d.sort((a,b)=>Math.hypot(a.x-ref.x,a.y-ref.y)-Math.hypot(b.x-ref.x,b.y-ref.y));wake(d[0],500)}}
if(T-lastProg>38&&phase==='garden'){lastProg=T;const d=dormant();if(d.length)wake(d[0],0)}
if(life>=6)once('c2',()=>say('So I made you a garden.',{y:H*.16}));
if(life>=11)once('c3',()=>say('These ones won’t ever wilt.',{y:H*.22}));
const ch=chainL();if(!finalGo&&phase==='garden'&&life>=12&&ch.every(f=>f.o>.85&&f.opened)){finalGo=1;setTimeout(final,4500)}}
async function final(){phase='final';const f0=Fl.find(f=>f.role==='seeder');ws=null;em={x:f0.hx,y:f0.hy,vx:0,vy:-30,ph:2,a:0,i:0,wait:0,tr:0,w:[{x:.5,y:.4,r:0,d:99}],fin:1};
await sleep(7500);spell($('#f1'),'For Reela,',110);await sleep(4200);spell($('#f2'),'because some flowers\nare worth coding.',70);await sleep(6800);spell($('#f3'),'With love.',140);await sleep(6000);$('#rp').classList.add('v')}
$('#rp').onclick=()=>location.reload();
// ---------- loop ----------
let last=0;
function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000||.016);last=t;T+=dt;
wind=Math.sin(T*.11)*.6+Math.sin(T*.27+2)*.4;
const ta=touch?(P.down?1:0):(P.in?1:0);P.a+=(ta-P.a)*(1-Math.exp(-dt*(touch&&!P.down?1.6:6)));
P.px=P.x;P.py=P.y;P.x+=(P.tx-P.x)*(1-Math.exp(-dt*22));P.y+=(P.ty-P.y)*(1-Math.exp(-dt*22));P.sp+=(Math.hypot(P.x-P.px,P.y-P.py)/dt-P.sp)*.2;
P.still=P.sp<25&&P.a>.2?P.still+dt:0;
if(P.a>.3&&P.sp>180&&Math.random()<.25&&phase==='garden')Pt.push({k:'sp',x:P.x,y:P.y,vx:R(-15,15),vy:R(-20,0),t:0,life:R(.8,1.5)});
if(P.down&&Math.hypot(P.tx-P.hx,P.ty-P.hy)<18){P.hold+=dt;if(P.hold>1.4&&phase==='garden'){P.hold=-99;const f=Fl.filter(q=>q.g>.5).sort((a,b)=>Math.hypot(a.hx-P.x,a.hy-P.y)-Math.hypot(b.hx-P.x,b.hy-P.y))[0];if(f&&Math.hypot(f.hx-P.x,f.hy-P.y)<120*U){f.gU=T+7;life+=.5;pollen(f,14);chime(2,.05);once('hold',()=>say('stay a little longer.',{hand:1,x:f.hx,y:f.hy-80*U,dur:6000}))}}}else if(!P.down)P.hold=0;
const cx0=P.a>.1?(P.x/W-.5)*P.a:Math.sin(T*.07)*.08;cam.x+=(cx0-cam.x)*dt*1.2;
if(phase!=='load'){updEm(dt);updWisp(dt);updPt(dt);if(phase==='garden'||phase==='final')stage();if(finalGo){warm=Math.min(1,warm+dt/18)}}
if(em&&em.fin){em.vy-=8*dt;steer(em,W/2,H*.5,dt,.35,40);em.a=Math.min(1,em.a+dt*.4);trail(em,dt)}
draw(dt)}
// ---------- start ----------
rs();addEventListener('resize',rs);plant();initPt();requestAnimationFrame(frame);
(async()=>{await Promise.race([document.fonts.ready,sleep(2500)]);await sleep(1500);$('#ld').classList.add('off');await sleep(2000);phase='intro';let d=spell($('#i1'),'My dearest Reela,',95);await sleep(d+2800);d=spell($('#i2'),'I’ve never really given you flowers…\nso I decided to code some for you.',55);await sleep(d+4000);d=spell($('#i3'),'Come a little closer.',80);await sleep(d+4000);$('#intro').classList.add('out');await sleep(2400);emberGo()})();
</script></body></html>
